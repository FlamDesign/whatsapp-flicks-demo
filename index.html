<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Flicks on WhatsApp: concept demo</title>
<meta name="description" content="Clickable concept by Flam: Flicks as the media in business promotional messages, brand catalogs and Status.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://native-ads-dev.appless.workers.dev" crossorigin>
<link rel="preconnect" href="https://native-ads.appless.workers.dev" crossorigin>
<link rel="preconnect" href="https://flicks.flamapp.live" crossorigin>
<link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<style>
:root{
  --green:#1daa61; --green-d:#008069; --out:#d9fdd3; --wall:#efeae2; --ink:#0a0a0a; --sub:#667781; --line:#e6e6e6;
  --blue:#007aff; --tick:#53bdeb; --bar:#f7f7f7; --ease:cubic-bezier(.2,.8,.2,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:#e9ebee;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{display:block}

/* ---------- stage ---------- */
.stage{height:100dvh;display:flex;align-items:center;justify-content:center;gap:92px;padding:20px}
.side{width:230px}
.side h1{font-size:22px;line-height:1.15;margin:0 0 18px;letter-spacing:-.02em}
.side .fbtn{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:500;margin-bottom:6px;background:#fff;border:1px solid #dfe2e6;transition:background .15s,border-color .15s}
.side .fbtn:hover{border-color:#b9bec5}
.side .fbtn.on{background:#111;color:#fff;border-color:#111}
.side p{font-size:11.5px;line-height:1.45;color:#7b828a;margin:18px 0 0}
.phone{position:relative;width:390px;height:min(844px,calc(100dvh - 40px));flex:none;border-radius:54px;background:#000;padding:11px;box-shadow:0 0 0 2px #2a2a2c,0 30px 70px rgba(0,0,0,.28)}
.app{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#fff;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:60;pointer-events:none}
.sbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:55;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 38px;font-weight:600;font-size:16px;pointer-events:none;color:#000;transition:color .2s}
.sbar.lt{color:#fff}
.sbar .r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;z-index:60;pointer-events:none;transition:background .2s}
.homebar.lt{background:#fff}
.fab{display:none}

/* ---------- screens ---------- */
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:#fff;padding-top:54px}
.scr.on{display:flex}
.scr.push{animation:push .32s var(--ease)}
.scr.pop{animation:pop .28s var(--ease)}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
@keyframes pop{from{transform:translateX(-22%);opacity:.6}to{transform:none;opacity:1}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* tab screens */
.tophdr{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 0;height:40px}
.tophdr .ic{width:30px;height:30px;border-radius:50%;background:#f0f0f0;display:grid;place-items:center}
.tophdr .ic.g{background:var(--green);color:#fff}
.tophdr .rt{display:flex;gap:14px}
.big{font-size:33px;font-weight:700;letter-spacing:-.02em;padding:2px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.big .rt{display:flex;gap:12px}
.big .ic{width:32px;height:32px;border-radius:50%;background:#f0f0f0;display:grid;place-items:center;color:#111}
.big .ic.g{background:var(--green);color:#fff}
.search{margin:0 16px 10px;height:36px;border-radius:10px;background:#f0f0f0;display:flex;align-items:center;gap:6px;padding:0 9px;color:#8a8a8e;font-size:17px}
.chips{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.chips span{padding:6px 13px;border-radius:17px;background:#f0f0f0;color:#5b6168;font-size:14.5px;font-weight:500;white-space:nowrap}
.chips span.on{background:#d9fdd3;color:#15603e}
.row{display:flex;gap:12px;padding:0 0 0 16px;align-items:center;width:100%;text-align:left}
.row:active{background:#f2f2f2}
.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;letter-spacing:-.02em;overflow:hidden;position:relative;background:#cfd4d8}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.s52{width:52px;height:52px;font-size:17px}.av.s36{width:36px;height:36px;font-size:12px}.av.s40{width:40px;height:40px;font-size:13px}
span.av{display:grid!important;color:#fff!important}.av.s52{font-size:17px!important}.av.s36{font-size:12px!important}.av.s40{font-size:13px!important}.av.sm{font-size:10px!important}
.row .bd{flex:1;min-width:0;border-bottom:.5px solid #dcdcdc;padding:11px 16px 11px 0;min-height:74px}
.row .l1{display:flex;align-items:center;gap:4px}
.row .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{margin-left:auto;font-size:14px;color:var(--sub);flex:none;padding-left:8px}
.row.un .tm{color:var(--green)}
.row .l2{display:flex;gap:6px;margin-top:2px}
.row .pv{flex:1;font-size:15px;line-height:1.3;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{flex:none;min-width:20px;height:20px;border-radius:10px;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;margin-top:2px}
.vf{flex:none;color:var(--blue)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;background:rgba(247,247,247,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid #d3d3d3;display:none;justify-content:space-around;padding:7px 4px 0;z-index:20}
.tabbar.on{display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:#8a8a8e;position:relative;height:46px}
.tabbar button.on{color:#000}
.tabbar .dot{position:absolute;top:-1px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--green);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.tabpad{height:90px}
.sect{font-size:20px;font-weight:700;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.sect small{font-size:15px;font-weight:500;color:var(--green-d)}
.empty{flex:1;display:grid;place-items:center;color:var(--sub);font-size:15px;padding-bottom:90px}

/* status rail */
.rail{display:flex;gap:9px;padding:0 16px 6px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.sc{flex:none;width:98px;height:158px;border-radius:14px;position:relative;overflow:hidden;text-align:left;color:#fff}
.sc .bgc{position:absolute;inset:0;display:grid;place-items:center}
.sc .bgc img{width:100%;height:100%;object-fit:cover}
.sc .bgc img.lg{object-fit:contain}
.sc .bgc b{font-size:19px;font-weight:800;letter-spacing:.02em;opacity:.96;padding:0 6px;text-align:center}
.sc .flick{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;background:transparent;pointer-events:none}
.sc .flick .fstate,.sc .flick .fwarn{display:none}
.sc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 35%,transparent 55%,rgba(0,0,0,.55))}
.sc .ring{position:absolute;top:8px;left:8px;z-index:2;padding:2px;border-radius:50%;border:2.5px solid var(--green);background:transparent}
.sc.seen .ring{border-color:rgba(255,255,255,.65)}
.sc .n{position:absolute;left:9px;right:6px;bottom:8px;z-index:2;font-size:13px;font-weight:600;line-height:1.15}
.sc.me{background:#e9edef;color:#111}
.sc.me::after{display:none}
.sc.me .plus{position:absolute;top:36px;left:36px;z-index:3;width:20px;height:20px;border-radius:50%;background:var(--green);border:2px solid #fff;display:grid;place-items:center;color:#fff}
.chrow{display:flex;gap:12px;align-items:center;padding:8px 16px}
.chrow .t{flex:1;min-width:0}
.chrow .t b{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:600}
.chrow .t span{font-size:13.5px;color:var(--sub)}
.chrow .fl{padding:7px 16px;border-radius:17px;background:#d9fdd3;color:#15603e;font-size:14px;font-weight:600}

/* ---------- chat ---------- */
.chdr{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 6px 6px;background:var(--bar);border-bottom:.5px solid #d3d3d3;flex:none;z-index:3}
#s-chat,#s-catalog,#s-pdp{background:var(--bar)}
.back{display:flex;align-items:center;color:#000;height:40px;padding:0 2px 0 4px;font-size:16px;gap:1px}
.chdr .who{flex:1;min-width:0;display:flex;gap:9px;align-items:center;text-align:left}
.chdr .who b{display:flex;align-items:center;gap:4px;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.chdr .who span{display:block;font-size:12.5px;color:var(--sub);margin-top:-1px}
.chdr .acts{display:flex;gap:18px;padding-right:4px;color:#000}
.wall{background-color:var(--wall);background-image:radial-gradient(rgba(120,100,70,.09) 1.2px,transparent 1.4px),radial-gradient(rgba(120,100,70,.06) 1px,transparent 1.2px);background-size:26px 26px,26px 26px;background-position:0 0,13px 13px}
.msgs{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;min-height:100%;justify-content:flex-end}
.sys{align-self:center;max-width:86%;text-align:center;font-size:12.5px;line-height:1.35;border-radius:8px;padding:5px 10px;margin:5px 0;box-shadow:0 1px .5px rgba(0,0,0,.08)}
.sys.day{background:#fff;color:#54656f;font-weight:500;padding:4px 11px}
.sys.info{background:#d5f0ec;color:#44555c}
.b{position:relative;max-width:80%;border-radius:9px;padding:6px 8px 7px;font-size:16px;line-height:1.32;box-shadow:0 1px .5px rgba(11,20,26,.13);background:#fff;align-self:flex-start;word-wrap:break-word;animation:pin .25s var(--ease)}
@keyframes pin{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.b.o{background:var(--out);align-self:flex-end}
.b.first{border-top-left-radius:0;margin-top:5px}.b.o.first{border-top-left-radius:9px;border-top-right-radius:0}
.b.first::before{content:"";position:absolute;top:0;left:-7px;width:8px;height:12px;background:#fff;clip-path:polygon(100% 0,0 0,100% 100%)}
.b.o.first::before{left:auto;right:-7px;background:var(--out);clip-path:polygon(0 0,100% 0,0 100%)}
.b .meta{float:right;font-size:11px;color:#667781;margin:7px 0 -4px 10px;display:flex;gap:3px;align-items:center}
.b .meta svg{color:var(--tick)}
.b .snd{display:block;font-size:13.5px;font-weight:600;margin-bottom:1px}
.b.tpl{width:min(312px,84%);max-width:none;padding:3px 3px 0}
.b.tpl .flick{border-radius:7px}
.b.tpl .tx{padding:6px 6px 7px;overflow:hidden}
.b.tpl .tx b{font-weight:700}
.b .btns{border-top:.5px solid #e2e2e2;margin:0 -3px}
.b .btns button{display:flex;width:100%;height:42px;align-items:center;justify-content:center;gap:7px;color:var(--green-d);font-size:16px;font-weight:500;border-bottom:.5px solid #e2e2e2}
.b .btns button:last-child{border-bottom:0}
.b .btns button:active{background:#f3f3f3}
.b.cat{width:min(300px,82%);max-width:none;padding:3px 3px 0}
.b.cat .cc{display:flex;gap:10px;background:#f5f6f6;border-radius:7px;overflow:hidden;align-items:center;text-align:left;width:100%}
.b.cat .cc .th{width:72px;height:72px;flex:none;background:#b3121d;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.b.cat .cc b{display:block;font-size:15px}.b.cat .cc span{font-size:13px;color:var(--sub)}
.inbar{flex:none;display:flex;align-items:center;gap:10px;padding:7px 10px calc(7px + 26px);background:var(--bar);border-top:.5px solid #d3d3d3;color:#000}
.inbar .f{flex:1;height:36px;border-radius:18px;background:#fff;border:.5px solid #d0d0d0;display:flex;align-items:center;padding:0 10px 0 13px}
.inbar input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:none;min-width:0}
.inbar .send{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:none;place-items:center;flex:none}
.inbar.typing .send{display:grid}.inbar.typing .idle{display:none}

/* ---------- Flick stage ---------- */
.flick{position:relative;overflow:hidden;background:#efefef;width:100%;aspect-ratio:1/1}
.flick iframe{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0;opacity:0;transition:opacity .5s var(--ease)}
.flick.rdy iframe{opacity:1}
.fstate{position:absolute;inset:0;background:linear-gradient(100deg,#ececec 30%,#f7f7f7 50%,#ececec 70%);background-size:200% 100%;animation:shim 1.3s linear infinite;pointer-events:none;transition:opacity .4s}
.flick.dark,.flick.dark .fstate{background-color:#151515}
.flick.dark .fstate{background-image:linear-gradient(100deg,#151515 30%,#262626 50%,#151515 70%)}
.fstate.hide{opacity:0}
.fstate.err{animation:none;background:#fbeaea;color:#8a1f1f;display:grid;place-items:center;text-align:center;font-size:12.5px;line-height:1.4;padding:16px;pointer-events:auto}
.fstate.err b{display:block;font-size:14px;margin-bottom:4px}
@keyframes shim{to{background-position:-200% 0}}
.fwarn{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:3px 7px;border-radius:5px;pointer-events:none}

/* ---------- catalog ---------- */
.chdr .ttl{flex:1;font-size:17px;font-weight:600;text-align:center;margin-right:8px}
.cart{position:relative;padding:6px}
.cart i{position:absolute;top:0;right:-2px;min-width:17px;height:17px;border-radius:9px;background:var(--green);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:none;place-items:center;padding:0 4px}
.cart i.on{display:grid}
#s-catalog .scroll{background:#fff}
.biz{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:.5px solid #e2e2e2}
.biz b{display:flex;gap:4px;align-items:center;font-size:17px}
.biz span{font-size:13.5px;color:var(--sub)}
.coll{font-size:20px;font-weight:700;padding:16px 16px 4px}
.collsub{font-size:14px;color:var(--sub);padding:0 16px 12px}
.item{padding:0 0 18px;border-bottom:8px solid #f0f2f5}
.item .inf{padding:11px 16px 0}
.item .br{font-size:12.5px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.item .pn{font-size:17px;font-weight:600;margin-top:2px;transition:opacity .15s}
.item .ds{font-size:14.5px;color:var(--sub);margin-top:3px;line-height:1.35}
.item .cta{display:flex;gap:8px;margin-top:12px}
.item .cta button{flex:1;height:40px;border-radius:20px;font-size:15px;font-weight:600;background:#eef8f1;color:var(--green-d)}
.item .cta button.p{background:var(--green);color:#fff}
.item .cta button.done{background:#d9fdd3;color:#15603e}

/* ---------- calls, communities ---------- */
.hub{display:flex;justify-content:space-between;padding:4px 22px 6px}
.hub button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.500px;color:#111;width:68px}
.hub button span{width:54px;height:54px;border-radius:50%;background:#f0f2f5;display:grid;place-items:center;color:#111}
.crw{display:flex;align-items:stretch;gap:12px;padding-left:16px}
.crw>.av{align-self:center}
.av.s44{width:44px;height:44px;font-size:15px!important}
.crw .cb{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 16px 8px 0;border-bottom:.5px solid #d9d9d9}
.crw .ct{flex:1;min-width:0}
.crw .ct b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crw .ct span{display:flex;align-items:center;gap:5px;font-size:15px;color:var(--sub);margin-top:1px}
.crw.miss .ct b{color:#e53935}
.crw .cw{font-size:15px;color:var(--sub);flex:none}
.crw .ci{color:#111;flex:none;display:grid}
.e2e{display:flex;gap:5px;align-items:center;justify-content:center;font-size:12px;color:var(--sub);padding:18px 16px}
.cempty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 30px 0}
.cart2{position:relative;width:150px;height:120px;margin-bottom:18px}
.cart2 span{position:absolute;border-radius:50%}
.cart2 .c1{left:35px;top:20px;width:80px;height:80px;background:#d9fdd3;color:#15603e;display:grid;place-items:center}
.cart2 .c1 svg{width:44px;height:40px}
.cart2 .c2{left:4px;top:8px;width:30px;height:30px;background:#cfe9ff}
.cart2 .c3{right:6px;top:0;width:22px;height:22px;background:#ffe2b8}
.cart2 .c4{right:0;bottom:8px;width:34px;height:34px;background:#f6d5e6}
.cempty h4{font-size:21px;margin:0 0 8px;letter-spacing:-.01em}
.cempty p{font-size:15px;line-height:1.4;color:var(--sub);margin:0 0 14px}
.cempty .lnk{color:var(--green-d);font-weight:600;font-size:15px;margin-bottom:22px}
.cempty .newc{display:flex;gap:8px;align-items:center;justify-content:center;height:46px;width:100%;border-radius:23px;background:var(--green);color:#fff;font-size:16px;font-weight:600}

/* ---------- product page ---------- */
#s-pdp .scroll{background:#fff}
.pinf{padding:14px 16px 0}
.pinf h2{font-size:21px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
.pprice{font-size:17px;color:#111;margin-bottom:10px}
.pinf p{font-size:15.500px;line-height:1.4;color:#3b4a54;margin:0 0 12px}
.plink{display:flex;align-items:center;gap:7px;color:var(--green-d);font-size:15.500px;font-weight:500;padding:10px 0;border-top:.5px solid #e2e2e2;width:100%;text-align:left}
.pbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 14px 30px;background:rgba(255,255,255,.96);border-top:.5px solid #dcdcdc;z-index:4}
.pb{flex:1;height:46px;border-radius:23px;font-size:16px;font-weight:600;background:#eef8f1;color:var(--green-d)}
.pb.p{background:var(--green);color:#fff}
.qty.big{height:46px;border-radius:23px;padding:0 6px;flex:1;justify-content:space-between}
.qty.big button{width:40px;height:40px;font-size:24px}.qty.big b{font-size:17px}
.chead{display:flex;justify-content:space-between;align-items:center}
.chead h3{margin:0 0 10px}.chead button{color:var(--green-d);font-size:16px;font-weight:500;margin-bottom:10px}
.addmore{display:block;color:var(--green-d);font-size:15.500px;font-weight:600;padding:14px 0 2px}
.csend{display:flex;gap:10px;align-items:center;margin-top:12px}
.csend .f{flex:1;height:42px;border-radius:21px;background:#f0f2f5;display:flex;align-items:center;padding:0 16px;color:#8a8a8e;font-size:16px}
.csend button{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}

/* ---------- cart, order, payment ---------- */
.cart.hc{padding:0;margin-right:-4px}
.cart.hc i{top:-6px;right:-8px}
.cart.bump{animation:bump .45s var(--ease)}
@keyframes bump{0%{transform:scale(.5)}55%{transform:scale(1.25)}100%{transform:none}}
.b .pr{font-weight:600;margin-top:3px}
.b .btns button.ok{color:#15603e;background:#eef8f1}
.b.sentcart{width:min(280px,78%);max-width:none;padding:3px 3px 0}
.b .oc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:rgba(0,0,0,.05);border-radius:7px;padding:9px 10px}

  <div class="pbar" id="pbar"></div>`;
  show("s-pdp", anim); renderPbar();
}
function pdpItem(){ const s=SLOTS[PDP.slot]; const name=prodName(PDP.brand, s?s.variant:0); return { name, key:PDP.brand+"|"+name }; }
function renderPbar(){
  if(!PDP || !$("pbar")) return;
  const it=pdpItem(), hit=CARTS[PDP.chat].find(i=>i.key===it.key), pn=document.querySelector("[data-pname]");
  if(pn && pn.textContent!==it.name) pn.textContent=it.name;
  $("pbar").innerHTML = hit
    ? `<span class="qty big"><button onclick="pdpQty(-1)" aria-label="Less">−</button><b>${hit.qty}</b><button onclick="pdpQty(1)" aria-label="More">+</button></span><button class="pb p" onclick="openCart('${PDP.chat}')">View cart</button>`
    : `<button class="pb" onclick="askAbout('${PDP.slot}')">Message business</button><button class="pb p" onclick="pdpQty(1)">Add to cart</button>`;
}
function pdpQty(d){
  const it=pdpItem(), cart=CARTS[PDP.chat], k=cart.findIndex(i=>i.key===it.key);
  if(k<0){ if(d>0) cart.push({ key:it.key, brand:PDP.brand, name:it.name, price:PRODUCTS[PDP.brand].price, qty:1 }); }
  else { cart[k].qty+=d; if(cart[k].qty<=0) cart.splice(k,1); }
  syncCart(PDP.chat); renderPbar();
}
function closePdp(){ if(!PDP) return; PDP.from==="catalog" ? openCatalog(PDP.chat,"pop") : openChat(PDP.chat,"pop"); }

/* ================= Catalog ================= */
let catChat="macys";
function openCatalog(chat="macys", anim="push"){
  catChat=chat; openChatId=chat;
  const shop=SHOPS[chat], biz=BRANDS[CHATS.find(c=>c.id===chat).biz], n=cartCount(chat);
  const el=$("s-catalog"); dropSlots(el);
  el.innerHTML = `
  <div class="chdr"><button class="back" onclick="openChat('${chat}','pop')" aria-label="Back">${I.back}</button><span class="ttl">Catalog</span><button class="cart" onclick="openCart('${chat}')" aria-label="Cart">${I.cart}<i data-cartbadge="${chat}" class="${n?"on":""}">${n||""}</i></button></div>
  <div class="scroll" id="fmt-catalog">
    <div class="biz">${avatar(biz,"s52")}<span><b>${esc(biz.name)}${I.vf}</b><span>${esc(shop.kind)}</span></span></div>
    <div class="coll">${esc(shop.title)}</div><div class="collsub">${shop.items.length} item${shop.items.length===1?"":"s"}</div>
    ${shop.items.map(it=>{ const b=BRANDS[it.b], p=PRODUCTS[it.b], id="cat"+(++seq); return `
    <div class="item">${flick(id,it.b,true)}
      <div class="inf"><div class="br">${esc(b.name)}</div>
      <div class="pn" ${p.title?"":`data-vname="${id}"`}>${esc(p.title||b.variants[0].n)}</div>
      <div class="price">${usd(p.price)}</div>
      <div class="ds">${esc(it.ds)}</div>
      <div class="cta"><button class="p" onclick="openPdp('${chat}','${it.b}','catalog',SLOTS['${id}']?SLOTS['${id}'].variant:0)">View product</button></div></div>
    </div>`; }).join("")}
    <div style="height:90px"></div>
  </div>
  <button class="cartbar ${n?"on":""}" data-cartbar="${chat}" onclick="openCart('${chat}')"><span>View cart</span><em>${n} item${n===1?"":"s"} · ${usd(cartTotal(chat))}</em></button>`;
  show("s-catalog", anim);
}
function askAbout(id){ const s=SLOTS[id], pn=prodName(s.brand,s.variant), name=pn.startsWith(BRANDS[s.brand].name)?pn:BRANDS[s.brand].name+" "+pn; openChat(PDP?PDP.chat:catChat,"pop"); const i=$("msg"); i.value=`Is the ${name} available in my size?`; $("inbar").classList.add("typing"); i.focus({preventScroll:true}); }

/* ================= Updates + Status ================= */
const seen = new Set();
function renderUpdates(){
  dropSlots($("s-updates"));
  $("s-updates").innerHTML = `
  <div class="scroll">
    <div class="big">Updates<span class="rt"><span class="ic">${I.search}</span><span class="ic">${I.dots}</span></span></div>
    <div class="sect" style="padding-top:2px">Status</div>
    <div class="rail" id="fmt-status">
      <div class="sc me"><span class="av s40" style="position:absolute;top:8px;left:8px;background:#c8ced3"><img src="${U("photo-1618244972963-dbee1a7edc95")}" alt="" onerror="this.remove()"></span><span class="plus"><svg width="10" height="10" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 3v12M3 9h12"/></svg></span><span class="n">Add status</span></div>
      ${STATUS.map((s,i)=>{ const b=BRANDS[s.b], img=b.variants.find(v=>v.img); return `
      <button class="sc ${seen.has(s.b)?"seen":""}" onclick="openStatus(${i})">
        <span class="bgc" style="background:${img?"#f3f3f3":(b.lbg||"#fff")}">${img?`<img src="${img.img}" alt="" data-c="${b.avc}" data-n="${esc(b.name)}" onerror="scFail(this)">`:`<img class="lg" src="${esc(b.logo||("logos/"+b.key+".png"))}" alt="" data-c="${b.avc}" data-n="${esc(b.name)}" onerror="scFail(this)">`}${flick("sp"+(++seq),s.b,false,false,true)}</span>
        <span class="ring">${avatar(b,"s36")}</span><span class="n">${esc(b.name)}</span>
      </button>`; }).join("")}
    </div>
    <div class="sect">Channels<small>Explore</small></div>
    ${["zara","cad","bj","airbnb"].map(k=>{ const b=BRANDS[k]; return `<div class="chrow">${avatar(b,"s52")}<span class="t"><b>${esc(b.name)}${I.vf}</b><span>Official channel</span></span><button class="fl" onclick="this.textContent='Following'">Follow</button></div>`; }).join("")}
    <div class="tabpad"></div>
  </div>`;
}
function scFail(im){ const p=im.parentNode, b=document.createElement('b'); b.textContent=im.dataset.n; p.style.background=im.dataset.c; im.replaceWith(b); }
let sIdx=0, pane=null;
function paneHTML(i){
  const s=STATUS[i], b=BRANDS[s.b], id="st"+(++seq), tall=b.ar==="tall";
  return `<div class="prog"><i class="cur"></i></div>
  <div class="vhdr"><button class="back" onclick="closeStatus()" aria-label="Back">${I.back}</button>${avatar(b,"s36")}<span class="t"><b>${esc(b.name)}${I.vf}</b><span>${s.ago}</span></span>${I.dots}</div>
  <div class="vmedia">${flick(id,s.b,false,true)}${tall?"":`<div class="vcap">${esc(s.cap)}</div>`}</div>
  <div class="vbot"><span class="rp">Reply</span><span class="hrt"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20.500s-7.500-4.600-7.500-10.200A4.300 4.300 0 0 1 12 7.800a4.300 4.300 0 0 1 7.500 2.500c0 5.600-7.500 10.200-7.500 10.200z"/></svg></span></div>`;
}
function makePane(i){
  const el=document.createElement("div"); el.className="vpane"; el.innerHTML=paneHTML(i);
  el.querySelector(".prog i").addEventListener("animationend", ()=>{ if(el===pane && !drag) stepStatus(1); });
  return el;
}
function killPane(el){ el.querySelectorAll(".flick[data-slot]").forEach(unmount); dropSlots(el); el.remove(); }
function syncArrows(){ $("arr-l").disabled = sIdx===0; }
function openStatus(i){
  const v=$("viewer"); v.querySelectorAll(".vpane").forEach(killPane);
  sIdx=i; seen.add(STATUS[i].b); pane=makePane(i); v.appendChild(pane); tab="updates";
  show("viewer"); pane.querySelectorAll(".flick[data-slot]").forEach(mount); syncArrows();
}
const CUBE = (x,w) => `translateX(${x}px) rotateY(${(x/w)*42}deg)`;
/* Move to the neighbouring brand's status with the cube turn; `from` is where the finger let go. */
function stepStatus(dir, from=0){
  if(cur!=="viewer" || !pane) return;
  const n=sIdx+dir, v=$("viewer"), w=v.clientWidth;
  if(n<0){ settle(); return; }
  if(n>=STATUS.length){ closeStatus(); return; }
  const old=pane; sIdx=n; seen.add(STATUS[n].b);
  pane=makePane(n); pane.style.transformOrigin = dir>0 ? "left center" : "right center";
  pane.style.transform=CUBE(dir*w + from, w); v.appendChild(pane);
  pane.querySelectorAll(".flick[data-slot]").forEach(mount);
  old.classList.remove("hold"); old.style.transformOrigin = dir>0 ? "right center" : "left center";
  void pane.offsetWidth;
  old.classList.add("anim"); pane.classList.add("anim");
  old.style.transform=CUBE(-dir*w, w); pane.style.transform="none";
  setTimeout(()=>{ killPane(old); if(pane) pane.classList.remove("anim"); }, 360);
  syncArrows();
}
function settle(){ if(!pane) return; pane.classList.add("anim"); pane.style.transform="none"; pane.style.opacity=1; const p=pane; setTimeout(()=>p.classList.remove("anim"),360); }
function restartBar(){ const b=pane&&pane.querySelector(".prog i"); if(!b) return; b.classList.remove("cur"); void b.offsetWidth; b.classList.add("cur"); }
function closeStatus(){ const v=$("viewer"); goTab("updates"); v.querySelectorAll(".vpane").forEach(killPane); pane=null; }

/* One gesture model for drags that start on the Flick (reported from its frame) and drags on the rest of the viewer. */
let drag=null;
function gesture(ph, dx, dy){
  if(cur!=="viewer" || !pane) return;
  const w=$("viewer").clientWidth;
  if(ph==="s"){ drag={axis:null,t:Date.now()}; pane.classList.add("hold"); pane.classList.remove("anim"); return; }
  if(!drag) return;
  if(ph==="m"){
    if(!drag.axis) drag.axis = Math.abs(dx)>=Math.abs(dy) ? "x" : "y";
    if(drag.axis==="x"){
      const edge = (dx>0 && sIdx===0); const x = edge ? dx*.3 : dx;
      pane.style.transformOrigin = x<0 ? "right center" : "left center";
      pane.style.transform = CUBE(x, w);
    } else {
      const y=Math.max(0,dy); pane.style.transformOrigin="center";
      pane.style.transform=`translateY(${y}px) scale(${1-Math.min(y,400)/1600})`; pane.style.opacity=1-Math.min(y,400)/700;
    }
    return;
  }
  const d=drag; drag=null; pane.classList.remove("hold");
  const fast = Date.now()-d.t < 280;
  if(d.axis==="x" && (Math.abs(dx)>w*.28 || (fast && Math.abs(dx)>36))){ if(dx<0) stepStatus(1, dx); else if(sIdx>0) stepStatus(-1, dx); else settle(); }
  else if(d.axis==="y" && (dy>120 || (fast && dy>50))) closeStatus();
  else if(d.axis) settle();
}
(function(){
  const v=$("viewer"); let sx=0, sy=0, on=false, mv=false, tgt=null;
  v.addEventListener("pointerdown", e=>{ if(e.target.closest("button")) return; on=true; mv=false; sx=e.clientX; sy=e.clientY; tgt=e.target; try{ v.setPointerCapture(e.pointerId); }catch(_){} gesture("s",0,0); });
  v.addEventListener("pointermove", e=>{ if(!on) return; const dx=e.clientX-sx, dy=e.clientY-sy; if(!mv && Math.abs(dx)+Math.abs(dy)<10) return; mv=true; gesture("m",dx,dy); });
  const end=e=>{ if(!on) return; on=false; const held=drag && Date.now()-drag.t>350;
    gesture("e", mv?e.clientX-sx:0, mv?e.clientY-sy:0);
    /* A plain tap on the empty area steps back or forward, like the app. */
    if(!mv && !held && e.type==="pointerup" && tgt && !tgt.closest(".vhdr,.vbot,.flick")){ const r=v.getBoundingClientRect(); stepStatus((e.clientX-r.left) < r.width*.3 ? -1 : 1); }
  };
  v.addEventListener("pointerup", end); v.addEventListener("pointercancel", end);
})();
document.addEventListener("keydown", e=>{
  if(cur!=="viewer") return;
  if(e.key==="ArrowRight") stepStatus(1);
  if(e.key==="ArrowLeft") stepStatus(-1);
  if(e.key==="Escape") closeStatus();
});

/* ================= warm-up =================
   After the first screen is up, each Flick is loaded once off screen, one at a time, so its player, skin and
   video are already in the browser cache when the viewer opens it. It waits whenever a visible Flick is loading. */
const WARMING = {}, WARM_ORDER = ["nike","levis","cad","zara","bj","coach","lego","bose","acer","airbnb"];
window.__warm = [];
function prewarm(){
  const box=document.createElement("div"); box.setAttribute("aria-hidden","true");
  box.style.cssText="position:fixed;left:-4000px;top:0;width:540px;height:640px;overflow:hidden;opacity:0;pointer-events:none";
  document.body.appendChild(box);
  let i=0;
  const busy=()=>Object.values(SLOTS).some(s=>s.mounted && !s.ready && !s.error);
  const next=()=>{
    if(i>=WARM_ORDER.length){ box.remove(); return; }
    if(busy() || document.hidden){ setTimeout(next,500); return; }
    const k=WARM_ORDER[i++], b=BRANDS[k], id="warm-"+k, [bw,bh]=baseOf(b), t0=performance.now();
    const f=document.createElement("iframe"); f.width=bw; f.height=bh; f.style.cssText=`width:${bw}px;height:${bh}px;border:0`;
    f.setAttribute("allow","autoplay"); f.srcdoc=tagDoc(id,b,false,false,false);
    let over=false;
    const done=why=>{ if(over) return; over=true; clearTimeout(tm); delete WARMING[id]; window.__warm.push(k+":"+why+":"+Math.round(performance.now()-t0));
      setTimeout(()=>{ f.remove(); next(); }, why==="ready"?1200:0); };
    const tm=setTimeout(()=>done("timeout"),15000);
    WARMING[id]=done; box.appendChild(f);
  };
  next();
}
addEventListener("load", ()=>setTimeout(prewarm, 700));

/* ================= sheets ================= */
function openLink(brand, url){
  const b=BRANDS[brand]; let host=b.domain; try{ host=new URL(url).hostname.replace(/^www\./,""); }catch(e){}
  $("sheet").innerHTML = `<div class="grab"></div><div class="dm">${avatar(b,"s40")}<span><b>${esc(b.name)}</b><span>${esc(host)}</span></span></div>
    <p>The demo ends here. In the app this opens the product page for the option picked in the Flick.</p>
    <a href="${esc(url)}" target="_blank" rel="noopener" onclick="closeSheet()">Open ${esc(host)}</a><button class="x" onclick="closeSheet()">Close</button>`;
  sheetOn();
}
function openFormats(){
  $("sheet").innerHTML = `<div class="grab"></div><h3>Explore Flicks</h3>${FORMATS.map(([k,l])=>`<button class="fbtn" onclick="closeSheet();jump('${k}')">${l}</button>`).join("")}`;
  sheetOn();
}
function sheetOn(){
  $("toast").classList.remove("on"); $("sheet").classList.add("on"); $("scrim").classList.add("on");
  if(!sheetHist){ sheetHist=true; hq(()=>history.pushState({sheet:1},"")); }
}
function closeSheet(){
  $("sheet").classList.remove("on"); $("scrim").classList.remove("on");
  if(sheetHist){ sheetHist=false; hq(()=>{ ignorePops++; history.back(); }); }
}
function jump(k){
  if(k==="promo") openChat("nike");
  else if(k==="catalog") openCatalog("macys");
  else openStatus(0);
}

/* ================= freshness =================
   Phones and in-app browsers hold on to an old copy of this page. On load, ask the server which build is current
   and reload once onto it if this copy is older. */
const BUILD="1794787189";
fetch("version.txt?"+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{ t=t.trim();
  if(t && t!==BUILD && !new URLSearchParams(location.search).get("v")?.includes(t)) location.replace(location.pathname+"?v="+t); }).catch(()=>{});

/* ================= boot ================= */
$("side-formats").innerHTML = FORMATS.map(([k,l])=>`<button class="fbtn" data-k="${k}" onclick="jump('${k}')">${l}</button>`).join("");
goTab("chats");
</script>
